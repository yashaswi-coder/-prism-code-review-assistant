[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-review"
version = "0.1.0"
description = "PRism: evidence-grounded code review assistant (work in progress)"
readme = "README.md"
# Declared minimum. Only Python 3.12.3 has actually been tested (see README).
requires-python = ">=3.10"
dependencies = [
    "ruff>=0.6,<1.0",
    "bandit>=1.7,<2.0",
    "pydantic>=2.6,<3.0",
    "streamlit>=1.35,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.poetry]
packages = [{ include = "prism", from = "src" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
